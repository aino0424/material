</head>

<body class="page-inner page-contact">

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <a href="index.html">
        <img src="img/rogo.png" alt="MATÉRIEL">
      </a>
    </div>

    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="hamburger" aria-label="メニューを開く">
      <span></span><span></span><span></span>
    </label>
    <nav class="header-nav">
      <ul class="header-menu">
        <li><a href="about.html">ABOUT</a></li>
        <li><a href="product.html">PRODUCT</a></li>
        <li><a href="order.html">ORDER</a></li>
        <li><a href="contact.html" class="is-current">CONTACT</a></li>
      </ul>
      <a href="#" class="sns-link">
        <img src="img/Instagram_Glyph_Black.png" class="sns-icon">
      </a>
    </nav>
  </div>
</header>

<main class="main">

  <!-- サイドバー -->
  <aside class="side-nav">
    <ul class="side-menu">
      <li><a href="about.html">ABOUT</a></li>
      <li><a href="product.html">PRODUCT</a></li>
      <li><a href="order.html">ORDER</a></li>
      <li><a href="contact.html" class="is-current">CONTACT</a></li>
    </ul>
    <a href="#" class="sns-link">
        <img src="img/Instagram_Glyph_Black.png" alt="Instagram" class="sns-icon">
      </a>
  </aside>

  <div class="page-content">

    <!-- hero -->
    <section class="hero contact-hero">
      <img src="img/pexels-ron-lach-8511322.jpg" alt="CONTACT">
      <h1 class="hero-title">CONTACT</h1>
    </section>

    <!-- form -->
    <section class="contact-content">
      <form class="contact-form">

        <div class="form-row">
          <label>お名前<span>*</span></label>
          <input type="text" placeholder="Name" required>
        </div>

        <div class="form-row">
          <label>メールアドレス<span>*</span></label>
          <input type="email" placeholder="Mail" required>
        </div>

        <div class="form-row">
          <label>電話番号</label>
          <input type="tel" placeholder="Tel">
        </div>

        <div class="form-row">
          <label>お問い合わせ内容<span>*</span></label>
          <textarea placeholder="Message" required></textarea>
        </div>

        <div class="form-submit">
          <button type="submit">Submit</button>
        </div>

      </form>
    </section>

  </div>
</main>

<footer class="footer">
